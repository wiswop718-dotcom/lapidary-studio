<head>

<title>Lapidary Studio</title>

<style>
:root{color-scheme:dark;--ink:#e9eef5;--mute:#9aabc0;--acc:#5fd4c8;--panel:rgba(18,22,29,.74);--line:rgba(255,255,255,.15);--card:#1b222d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#12161d;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cut2{pointer-events:none}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.money{font-size:13px;color:var(--mute)}.money b{color:var(--ink);font-size:18px}
.gauge{width:56%;max-width:260px}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
.lab b{color:var(--ink);font-size:20px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:5px;transition:width .12s}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-size:14px;color:var(--mute);pointer-events:none;line-height:1.6;padding:0 16px;text-shadow:0 1px 6px #000}
.hint b{color:var(--ink)}
.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:center}
button{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;backdrop-filter:blur(6px)}
button.on{background:var(--acc);color:#0b2723;border-color:var(--acc)}
button.gold{background:#f0b64a;color:#2a1c00;border-color:#f0b64a}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#act{flex:1;max-width:170px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.64);padding:16px;z-index:9}
.ov.show{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 22px;text-align:center;width:100%;max-width:340px;max-height:92vh;overflow:auto}
.card h2{margin:0 0 6px;font-size:21px}
.card p{margin:4px 0;color:var(--mute);font-size:14px}.card p b{color:var(--ink)}
.card button{width:100%;margin-top:8px}
.grade{font-size:56px;font-weight:700;line-height:1.1;color:#f0b64a}
.pf{font-size:20px;margin:8px 0 10px}
.shop{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{min-height:38px;padding:6px 11px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.row button{min-width:88px;min-height:42px;padding:8px 10px;font-size:14px}
input{font:inherit;font-size:16px;color:var(--ink);background:#10151c;border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
#photoImg{width:100%;border-radius:12px;display:block}
.ov{perspective:900px}
.card,.shop{animation:pop .5s cubic-bezier(.2,.9,.3,1.15) backwards;transform-origin:50% 100%}
@keyframes pop{from{opacity:0;transform:rotateX(-75deg) translateY(50px) scale(.9)}to{opacity:1;transform:none}}
button{transition:transform .12s,box-shadow .12s,background .2s;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.bot{perspective:600px}
.bot button{animation:bin .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.bot button:nth-child(2){animation-delay:.07s}.bot button:nth-child(3){animation-delay:.14s}.bot button:nth-child(4){animation-delay:.21s}
@keyframes bin{from{opacity:0;transform:rotateX(70deg) translateY(40px)}to{opacity:1;transform:none}}
.bar i{background:linear-gradient(90deg,var(--acc),#a8f5ea,var(--acc));background-size:200% 100%;animation:sh 2.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.grade{animation:gr 1s cubic-bezier(.2,.9,.3,1.3) .15s backwards}
@keyframes gr{from{opacity:0;transform:perspective(500px) rotateY(540deg) scale(.3)}to{opacity:1;transform:none}}
.row.ani{animation:rowin .45s cubic-bezier(.2,.9,.3,1.1) backwards;transform-origin:50% 0}
@keyframes rowin{from{opacity:0;transform:perspective(500px) rotateX(-70deg)}to{opacity:1;transform:none}}
.shop{perspective:700px}
.sc{width:34px;height:34px;perspective:240px}
.cube{position:relative;width:34px;height:34px;transform-style:preserve-3d;animation:cs 8s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,rgba(95,212,200,.6),rgba(130,150,255,.25))}
.cube i:nth-child(1){transform:translateZ(17px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(17px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(17px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(17px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(17px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(17px)}
@keyframes cs{to{transform:rotateX(360deg) rotateY(360deg)}}
.tg{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.12);margin:14px 0;overflow:hidden}
.tg .zone{position:absolute;top:0;bottom:0;background:rgba(95,212,200,.5)}
.tg .nd{position:absolute;top:0;bottom:0;width:5px;background:#fff;border-radius:3px;left:0}
#act.ready{animation:rdy .9s ease-in-out infinite alternate}
@keyframes rdy{from{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 0 rgba(240,182,74,0)}to{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 18px 4px rgba(240,182,74,.85)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ===== Grand Atelier UI ===== */
:root{--ink:#f6efe0;--mute:#b9ad94;--acc:#e8c872;--gold:#e8c872;--gold2:#b8892f;--gold3:#fff1bd;--panel:linear-gradient(180deg,rgba(40,34,26,.82),rgba(14,13,16,.86));--line:rgba(232,200,114,.38);--card:#14120f;

html,body{background:#0a0a0d}

.vig i:nth-child(3){left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-right:0;border-top:0;border-bottom-left-radius:18px}
.vig i:nth-child(4){right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-left:0;border-top:0;border-bottom-right-radius:18px}
.top,.hint,.bot{z-index:3}
.top{padding:20px 22px 12px}
.money{padding:7px 14px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,241,189,.25);font-size:11px;letter-spacing:.14em;color:var(--gold);font-family:var(--serif)}

.gauge{padding:8px 14px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,241,189,.25)}
.lab{font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--gold)}
.lab b{font-family:var(--num);font-size:26px;line-height:1;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:12px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(232,200,114,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.7);position:relative}
.bar::after{content:"";position:absolute;inset:0;border-radius:7px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.45) calc(10% - 1px) 10%);pointer-events:none}
.bar i{background:linear-gradient(90deg,#8a5f1c,#e8c872,#fff6cf,#e8c872,#b8892f);background-size:200% 100%;box-shadow:0 0 12px rgba(232,200,114,.8)}
.hint{font-family:var(--serif);font-size:14px;letter-spacing:.06em;color:#d9ccb0}
.hint b{color:var(--gold3)}
button{font-family:var(--serif);font-weight:700;letter-spacing:.1em;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.55),0 10px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,241,189,.28),inset 0 0 14px rgba(232,200,114,.06);position:relative;overflow:hidden}
button::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,246,207,.35),transparent);transform:skewX(-20deg);transition:left .6s}
button:hover::after{left:130%}
button:active{box-shadow:0 1px 0 rgba(0,0,0,.55),inset 0 2px 6px rgba(0,0,0,.4)}
button.on{background:linear-gradient(180deg,#fff1bd 0%,#e8c872 45%,#b8892f 100%);color:#2a1a02;border-color:#fff1bd;text-shadow:0 1px 0 rgba(255,255,255,.5)}
button.gold{background:linear-gradient(180deg,#ffe9a0 0%,#f0b64a 48%,#a8701a 100%);color:#2a1700;border-color:#ffe9a0;text-shadow:0 1px 0 rgba(255,255,255,.45)}
button:disabled{opacity:.4;filter:grayscale(.6)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold3);outline-offset:2px}
.bot{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@keyframes rdy{from{box-shadow:0 5px 0 rgba(0,0,0,.55),0 0 0 rgba(255,225,140,0)}to{box-shadow:0 5px 0 rgba(0,0,0,.55),0 0 26px 7px rgba(255,225,140,.95)}}
.ov{background:radial-gradient(ellipse at 50% 40%,rgba(30,22,10,.55),rgba(3,2,5,.88));backdrop-filter:blur(7px)}
.card,.shop{position:relative;background:linear-gradient(165deg,#241e15 0%,#14120f 38%,#0d0c10 100%);border:1px solid rgba(232,200,114,.7);border-radius:22px;box-shadow:0 0 0 5px rgba(10,9,8,.9),0 0 0 6px rgba(232,200,114,.35),0 30px 70px rgba(0,0,0,.75),0 0 60px rgba(232,200,114,.16),inset 0 1px 0 rgba(255,241,189,.35),inset 0 0 40px rgba(232,200,114,.06)}
.card{padding:28px 22px 22px;max-width:350px}
.shop{padding:20px 18px 16px;max-width:480px}

.card h2::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:9px;background:linear-gradient(90deg,transparent,var(--gold) 40%,transparent 48%) left center/100% 1px no-repeat,linear-gradient(90deg,transparent 52%,var(--gold) 60%,transparent) left center/100% 1px no-repeat;-webkit-mask:none}
.card h2::before{content:"";position:absolute;left:50%;bottom:1px;width:7px;height:7px;margin-left:-3.5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 8px var(--gold)}
.card p{font-family:var(--serif);color:var(--mute);letter-spacing:.04em;line-height:1.7}
.card p b{color:var(--gold3)}
.card button{margin-top:10px}
.grade{font-family:var(--num);font-size:92px;font-weight:700;line-height:1;margin:6px 0 4px;background:linear-gradient(180deg,#fffbe6 0%,#f6d77f 35%,#b8892f 60%,#ffe9a0 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(232,200,114,.65)) drop-shadow(0 3px 0 rgba(0,0,0,.6))}

.hd{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}

.hd>span{font-family:var(--num);font-size:22px;font-weight:700;color:var(--gold3);text-shadow:0 0 10px rgba(232,200,114,.5)}

.row b{color:var(--ink);letter-spacing:.06em}

.row button{font-family:var(--num),var(--serif);font-size:15px}

.tg .zone{background:linear-gradient(90deg,rgba(184,137,47,.7),rgba(255,233,160,.95),rgba(184,137,47,.7));box-shadow:0 0 12px rgba(255,225,140,.8)}

@keyframes gr{0%{opacity:0;transform:perspective(500px) rotateY(540deg) scale(.3)}100%{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(232,200,114,.45);border-radius:3px}

/* ===== animation upgrade ===== */
.money,.gauge{position:relative;overflow:hidden}

[null,'All set','Tap the ? button on the left to replay this tour anytime.']];
var S=EN?E:J,i=0,w,h,c;
function build(){
 w=document.createElement('div');w.id='tutW';
 w.innerHTML='<div id="tutH"></div><div id="tutC" role="dialog" aria-live="polite"><h3></h3><p></p><div class="tf"><div class="dots"></div><button class="sk">'+(EN?'Skip':'スキップ')+'</button><button class="on nx"></button></div></div>';
 document.body.appendChild(w);h=w.querySelector('#tutH');c=w.querySelector('#tutC');
 var d=c.querySelector('.dots');for(var k=0;k<S.length;k++)d.appendChild(document.createElement('i'));
 c.querySelector('.sk').onclick=end;c.querySelector('.nx').onclick=function(){i<S.length-1?(i++,show()):end()};
 w.addEventListener('pointerdown',function(e){e.stopPropagation()},true);
}
function show(){
 var s=S[i],t=s[0]?document.querySelector(s[0]):null,r,vw=innerWidth,vh=innerHeight;
 if(t){r=t.getBoundingClientRect();if(s[0]==='#c'){r={left:vw*.15,top:vh*.28,width:vw*.7,height:vh*.34,right:vw*.85,bottom:vh*.62}}}
 else r={left:vw/2,top:vh*.45,width:0,height:0,right:vw/2,bottom:vh*.45};
 var p=8;
 h.style.left=(r.left-p)+'px';h.style.top=(r.top-p)+'px';h.style.width=(r.width+p*2)+'px';h.style.height=(r.height+p*2)+'px';
 h.style.opacity=t?1:0;h.classList.toggle('pulse',!!t);
 c.querySelector('h3').textContent=s[1];c.querySelector('p').textContent=s[2];
 c.querySelector('.nx').textContent=i===S.length-1?(EN?'Start':'はじめる'):(EN?'Next':'次へ');
 var ds=c.querySelectorAll('.dots i');for(var k=0;k<ds.length;k++)ds[k].classList.toggle('o',k<=i);
 var cw=Math.min(vw*.92,330),left=Math.max(8,Math.min(vw-cw-8,(r.left+r.width/2)-cw/2));
 c.style.left=left+'px';c.style.right='auto';
 if(!t){c.style.top=(vh*.3)+'px';c.style.bottom='auto'}
 else if(r.top+r.height/2>vh*.55){c.style.bottom=(vh-r.top+p+14)+'px';c.style.top='auto'}
 else{c.style.top=(r.bottom+p+14)+'px';c.style.bottom='auto'}
}
function start(){if(!w)build();i=0;w.classList.add('show');show()}
function end(){if(w)w.classList.remove('show');try{localStorage.setItem(KEY,'1')}catch(e){}}
var b=document.createElement('button');b.id='tutB';b.setAttribute('aria-label',EN?'Tutorial':'チュートリアル');b.textContent='?';b.onclick=start;document.body.appendChild(b);
addEventListener('resize',function(){if(w&&w.classList.contains('show'))show()});
var done=false;try{done=localStorage.getItem(KEY)==='1'}catch(e){}
if(!done){var n=0,iv=setInterval(function(){n++;if(n>400){clearInterval(iv);return}
 if(document.querySelector('.ov.show'))return;clearInterval(iv);setTimeout(start,700)},300)}
})();
</script>
</body>
</html>
